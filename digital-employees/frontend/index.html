<body>
  <a class="skip-link" href="#main">跳转至工作区</a>
  <div id="login-root" class="login-root" hidden></div>
  <div id="shell" class="ui-shell" hidden>
    <header class="ui-topbar">
      <div class="ui-brand">
        <a href="#meetings" class="ui-logo" aria-label="返回三会智能审查">GT</a>
        <span class="ui-brand-company">通用技术</span>

      <div class="ui-topbar-right">

        <span class="environment"><span class="indicator"></span>一期工作台</span>

    <div class="app-layout">

        <div class="sidebar-footer"><span class="indicator"></span>初审服务<span class="service-state" id="service-state">运行正常</span></div>
      </aside>
      <main class="ui-main" id="main" tabindex="-1">
        <div class="content" id="view"></div>
      </main>
    </div>
  </div>
  <dialog id="overlay" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
