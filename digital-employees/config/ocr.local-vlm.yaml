# 本地联调用：资料中心走「客户 OCR 接口」这条链路，但地址指向本机仿真服务（tools/ocr_local_server.py）。
# 用法：设置环境变量 DE_OCR_CONFIG=config/ocr.local.yaml 后启动资料中心 / 运行工具；正式配置仍是 config/ocr.yaml。
#   仿真服务 RapidOCR 后端（带坐标，可高亮）：python tools/ocr_local_server.py --backend rapidocr --port 8092
#   仿真服务视觉模型后端（Ollama）：        python tools/ocr_local_server.py --backend ollama:qwen25vl-ocr --port 8093
engine: paddleocr_vl

paddleocr_vl:
  url: http://127.0.0.1:8093/paddleocr-vl/layout-parsing
  dpi: 150
  send_pdf: false
  concurrency: 1
  per_minute: 60
  timeout_s: 180
  retries: 2
  sec_per_page: 11
  options:
    useDocOrientationClassify: false
    useDocUnwarping: false
    useLayoutDetection: true
    returnMarkdownImages: false

