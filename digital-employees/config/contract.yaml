# 合同审核数字员工配置。修改后下一次审查生效。
#
# 2026-11-09 摸底确认：主合同审批 = 「销售合同（主合同）审批流程」wf=99；
# 投标文件、招标文件、中标证明不在合同流程中，按表单「选择投标项目」到投标及报价台账（customid=86）找到
# 「投标及报价审批流程」wf=98 读取。

workflow:
  name_contains: 主合同
  workflow_ids: [99]

ledgers:
  bid_quote:                   # 投标管理 → 投标及报价台账（R01 中标价、R02–R08 投标/招标文件、R06 联合体、R24 中标通知书）
    name: 投标及报价台账
    customid: 86
    match_field: tbxmmc        # 按「投标项目名称」与合同表单「选择投标项目」匹配
  main_contract:               # 主合同管理 → 销售合同（主合同）台账（R21 合同重复签订）
    name: 销售合同（主合同）台账
    customid: 78
    columns: {name: htmc, party: xmyzlssj, id: htbh, request_id: lcid, date: qdrq, status: htzhzt}
  cache_hours: 6               # 台账整表缓存时长（主合同台账约 1.2 万条，首次读取约 1–2 分钟）

# 表单字段别名：左边是规则使用的标准名，右边是合同系统表单里可能出现的标签（wf=99 实测标签在前）
form_fields:
  合同名称: [合同名称]
  合同编号: [合同编号, 临时合同编码]
  合同签订类型: [合同签订类型, 签订类型]
  业务类型: [业务类型, 合同业务类型, 合同类型, 业务性质]
  业务类型二级: [业务类型（二级）, 投标用业务类型]
  合同额: [合同额（万元）, 合同额, 合同金额, 合同总额, 合同额（元）, 合同金额（元）, 合同金额（万元）]
  联合体中标合同额: [联合体中标合同额（万元）, 联合体中标合同额]
  是否联合体: [是否联合体签约, 是否联合体, 是否联合体项目, 是否联合体中标]
  项目执行部门: [项目执行部门, 执行部门]
  会签部门: [会签部门]
  付款节点明细: [项目阶段及付款节点明细, 付款节点明细, 项目阶段及付款节点, 付款条件]
  是否触发采购需求: [是否触发采购需求审批流程, 是否触发采购需求]
  是否含技术协议: [合同是否包含技术、科研相关协议/条款, 是否含技术协议, 是否包含技术协议, 是否有技术协议]
  甲方单位名称: [甲方单位名称（文本）, 甲方单位名称, 甲方名称, 合同相对方, 相对方名称, 客户名称]
  是否涉及判决履行: [是否涉及判决履行]
  选择投标项目: [选择投标项目, 投标项目]
  合同设计阶段: [合同设计阶段, 设计阶段]
  合同签订日期: [合同签订日期, 签订日期]
  有无中标通知书: [有无中标通知书]
  投标方式: [投标方式, 招投标方式]
  工期: [工期（天）]
  项目负责人: [项目负责人]

# 我方主体名称（用于识别合同相对方）
our_names: [通用技术集团工程设计有限公司, 通用设计]

# 违约金比例上限（R10，原始规则为 30%）
penalty_limit_ratio: 0.30

# 中标合同签订时限（R24，自中标通知书发出之日起天数）
award_sign_days: 30
