# 三会审查的正式制度知识库（首批四份）。
#
# path：相对 digital-employees 目录或绝对路径；enabled：是否启用（停用后不参与检索与核验）。
# kind：解析方式 —— authority_manual 权责手册（表格，红色标记为最终审批主体）
#                   major_items      重大经营管理事项清单（√ 为决策主体）
#                   party_items      党委决定的重大事项清单（决策主体为党委会）
#                   board_authorization 董事会授权决策方案（授权董事长 → 专题会；授权总经理 → 总经理办公会）
# 修改文件或替换 PDF 后无需重启：按文件内容签名自动重新解析。

